name: Build Flutter Release

on:
  workflow_dispatch: # Allows manual triggering of the workflow
  push:
    tags:
      - 'v*' # Trigger on tags that start with 'v'

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Get tag
      id: get_tag
      run: |
        # Get the tag that triggered this workflow
        if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
          TAG_NAME="${{ github.ref_name }}"
        else
          # For manual triggers, get the latest tag
          TAG_NAME=$(git describe --tags `git rev-list --tags --max-count=1` 2>/dev/null || echo "v1.0.0")
        fi
        
        echo "Tag name: $TAG_NAME"
        echo "::set-output name=tag::$TAG_NAME"
        
        # Extract version from tag (removing 'v' prefix if present)
        VERSION=$(echo "$TAG_NAME" | sed 's/^v//')
        echo "::set-output name=version::$VERSION"
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'  
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version-file: pubspec.yaml
        cache: true

    - name: Get dependencies
      run: flutter pub get
      
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Android APK (arm64-v8a only)
      run: |
        flutter build apk --release --target-platform android-arm64
        mkdir -p build-artifacts/android
        # Extract version from tag (removing 'v' prefix if present)
        VERSION=${{ steps.get_tag.outputs.version }}
        cp build/app/outputs/flutter-apk/app-release.apk build-artifacts/android/mindlog_android_${VERSION}.apk

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk-${{ steps.get_tag.outputs.tag }}
        path: build-artifacts/android/

  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Get tag
      id: get_tag
      run: |
        # Get the tag that triggered this workflow
        if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
          TAG_NAME="${{ github.ref_name }}"
        else
          # For manual triggers, get the latest tag
          TAG_NAME=$(git describe --tags `git rev-list --tags --max-count=1` 2>/dev/null || echo "v1.0.0")
        fi
        
        echo "Tag name: $TAG_NAME"
        echo "::set-output name=tag::$TAG_NAME"
        
        # Extract version from tag (removing 'v' prefix if present)
        VERSION=$(echo "$TAG_NAME" | sed 's/^v//')
        echo "::set-output name=version::$VERSION"
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version-file: pubspec.yaml
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Build macOS App
      run: |
        flutter build macos --release
        mkdir -p build-artifacts/macos
        # Extract version from tag (removing 'v' prefix if present)
        VERSION=${{ steps.get_tag.outputs.version }}
        cd build/macos/Build/Products/Release
        zip -r ../../../../../build-artifacts/macos/mindlog_macos_${VERSION}.zip mindlog.app

    - name: Upload macOS App
      uses: actions/upload-artifact@v4
      with:
        name: macos-app-${{ steps.get_tag.outputs.tag }}
        path: build-artifacts/macos/

  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Get tag
      id: get_tag
      shell: bash
      run: |
        # Get the tag that triggered this workflow
        if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
          TAG_NAME="${{ github.ref_name }}"
        else
          # For manual triggers, get the latest tag
          TAG_NAME=$(git describe --tags `git rev-list --tags --max-count=1` 2>/dev/null || echo "v1.0.0")
        fi
        
        echo "Tag name: $TAG_NAME"
        echo "::set-output name=tag::$TAG_NAME"
        
        # Extract version from tag (removing 'v' prefix if present)
        VERSION=$(echo "$TAG_NAME" | sed 's/^v//')
        echo "::set-output name=version::$VERSION"
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version-file: pubspec.yaml
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Build Windows App
      shell: bash
      run: |
        flutter build windows --release
        mkdir -p build-artifacts/windows
        # Extract version from tag (removing 'v' prefix if present)
        VERSION=${{ steps.get_tag.outputs.version }}
        cp -r build/windows/x64/runner/Release/* build-artifacts/windows/
        cd build-artifacts/windows/
        # Use 7z which is available on Windows runners
        7z a -tzip mindlog_windows_${VERSION}.zip *
        # Clean up all files except the zip
        ls -1 | grep -v mindlog_windows_${VERSION}.zip | xargs rm -rf

    - name: Upload Windows App
      uses: actions/upload-artifact@v4
      with:
        name: windows-app-${{ steps.get_tag.outputs.tag }}
        path: build-artifacts/windows/

  # Combine all artifacts into a single release
  create-release:
    needs: [build-android, build-macos, build-windows]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get tag
      id: get_tag
      run: |
        # Get the tag that triggered this workflow
        if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
          TAG_NAME="${{ github.ref_name }}"
        else
          # For manual triggers, get the latest tag
          TAG_NAME=$(git describe --tags `git rev-list --tags --max-count=1` 2>/dev/null || echo "v1.0.0")
        fi
        
        echo "Tag name: $TAG_NAME"
        echo "::set-output name=tag::$TAG_NAME"
        
        # Extract version from tag (removing 'v' prefix if present)
        VERSION=$(echo "$TAG_NAME" | sed 's/^v//')
        echo "::set-output name=version::$VERSION"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: build-artifacts

    - name: Display structure of build artifacts
      run: ls -R build-artifacts

    - name: Read CHANGELOG.md
      id: changelog
      run: |
        # Get the tag name which includes the 'v' prefix
        TAG_NAME=${{ steps.get_tag.outputs.tag }}
        # Create release notes from CHANGELOG.md
        # We'll extract everything between the version header and the next version header or end of file
        awk "/^## \\\[${TAG_NAME}\\\]/,/^## \\\[.*\\\]/" CHANGELOG.md | sed '$d' > RELEASE_NOTES.md
        # If RELEASE_NOTES.md is empty, it means the version wasn't found in CHANGELOG.md
        if [ ! -s RELEASE_NOTES.md ]; then
          echo "Version ${TAG_NAME} not found in CHANGELOG.md. Using default release notes."
          echo "# Release Notes" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "No specific release notes found for this version in CHANGELOG.md." >> RELEASE_NOTES.md
        fi
        
        # Export the release notes content
        NOTES=$(cat RELEASE_NOTES.md)
        # Escape newlines and quotes for GitHub Actions
        NOTES="${NOTES//'%'/'%25'}"
        NOTES="${NOTES//$'\n'/'%0A'}"
        NOTES="${NOTES//$'\r'/'%0D'}"
        echo "::set-output name=notes::$NOTES"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.RELEASE_TOKEN }}
        tag_name: ${{ steps.get_tag.outputs.tag }}
        name: ${{ steps.get_tag.outputs.tag }}
        body: ${{ steps.changelog.outputs.notes }}
        draft: false
        prerelease: false
        files: |
          build-artifacts/android-apk-*/mindlog_android_*.apk
          build-artifacts/macos-app-*/mindlog_macos_*.zip
          build-artifacts/windows-app-*/mindlog_windows_*.zip