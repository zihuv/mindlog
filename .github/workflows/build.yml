name: Build Flutter Release

on:
  workflow_dispatch: # Allows manual triggering of the workflow
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_title:
        description: 'Release title'
        required: false
        default: 'Release'
      create_release:
        description: 'Create GitHub release'
        required: false
        default: false
        type: boolean

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'  
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version-file: pubspec.yaml
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Build Android APK (arm64-v8a only)
      run: |
        flutter build apk --release --target-platform android-arm64
        mkdir -p build-artifacts/android
        cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build-artifacts/android/mindlog-android-arm64.apk

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk-${{ inputs.release_tag }}
        path: build-artifacts/android/

  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version-file: pubspec.yaml
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Build macOS App
      run: |
        flutter build macos --release
        mkdir -p build-artifacts/macos
        cd build/macos/Build/Products/Release
        zip -r ../../../../../build-artifacts/macos/mindlog-macos.zip mindlog.app

    - name: Upload macOS App
      uses: actions/upload-artifact@v4
      with:
        name: macos-app-${{ inputs.release_tag }}
        path: build-artifacts/macos/

  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version-file: pubspec.yaml
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Build Windows App
      run: |
        flutter build windows --release
        New-Item -ItemType Directory -Force -Path build-artifacts
        New-Item -ItemType Directory -Force -Path build-artifacts\windows
        Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build-artifacts\windows\mindlog-windows.zip

    - name: Upload Windows App
      uses: actions/upload-artifact@v4
      with:
        name: windows-app-${{ inputs.release_tag }}
        path: build-artifacts/windows/

  # Combine all artifacts into a single release
  create-release:
    needs: [build-android, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: ${{ inputs.create_release }}
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: build-artifacts

    - name: Display structure of build artifacts
      run: ls -R build-artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.RELEASE_TOKEN }}
        tag_name: ${{ inputs.release_tag }}
        name: ${{ inputs.release_title }} ${{ inputs.release_tag }}
        draft: false
        prerelease: false
        files: |
          build-artifacts/android-apk-*/mindlog-*.apk
          build-artifacts/macos-app-*/mindlog-macos.zip
          build-artifacts/windows-app-*/mindlog-windows.zip