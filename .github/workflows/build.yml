name: Build Flutter Release

on:
  workflow_dispatch: # Allows manual triggering of the workflow
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_title:
        description: 'Release title'
        required: false
        default: 'Release'
      create_release:
        description: 'Create GitHub release'
        required: false
        default: true
        type: boolean

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version-file: 'pubspec.yaml'
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze project
      run: flutter analyze

    - name: Run tests
      run: flutter test

    - name: Build Android APK
      run: |
        flutter build apk --release --split-per-abi
        mkdir -p build-artifacts/android
        cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build-artifacts/android/mindlog-android-arm64.apk
        cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build-artifacts/android/mindlog-android-armeabi-v7a.apk
        cp build/app/outputs/flutter-apk/app-x86_64-release.apk build-artifacts/android/mindlog-android-x86_64.apk

    - name: Upload Android APKs
      uses: actions/upload-artifact@v4
      with:
        name: android-apks-${{ inputs.release_tag }}
        path: build-artifacts/android/

  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version-file: 'pubspec.yaml'
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Check if macOS build is enabled
      run: flutter config --enable-macos-desktop

    - name: Verify macOS build is available
      run: flutter doctor -v

    - name: Build macOS App
      run: |
        flutter build macos --release
        mkdir -p build-artifacts/macos
        cd build/macos/Build/Products/Release
        zip -r ../../../../../build-artifacts/macos/mindlog-macos.zip mindlog.app

    - name: Upload macOS App
      uses: actions/upload-artifact@v4
      with:
        name: macos-app-${{ inputs.release_tag }}
        path: build-artifacts/macos/

  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version-file: 'pubspec.yaml'
        cache: true

    - name: Check if Windows build is enabled
      run: flutter config --enable-windows-desktop

    - name: Get dependencies
      run: flutter pub get

    - name: Verify Windows build is available
      run: flutter doctor -v

    - name: Build Windows App
      run: |
        flutter build windows --release
        Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build-artifacts\windows\mindlog-windows.zip

    - name: Upload Windows App
      uses: actions/upload-artifact@v4
      with:
        name: windows-app-${{ inputs.release_tag }}
        path: build-artifacts/windows/

  # Combine all artifacts into a single release
  create-release:
    needs: [build-android, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: ${{ inputs.create_release }}
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: build-artifacts

    - name: Display structure of build artifacts
      run: ls -R build-artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag }}
        name: ${{ inputs.release_title }} ${{ inputs.release_tag }}
        draft: false
        prerelease: false
        files: |
          build-artifacts/android-apks-*/mindlog-*.apk
          build-artifacts/macos-app-*/mindlog-macos.zip
          build-artifacts/windows-app-*/mindlog-windows.zip